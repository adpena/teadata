options:
  private_dataset: tefa
metric_bindings:
  enrollment:
    dataset: '{scope}_tapr_student_staff_profile'
    field: student_enrollment_all_students_count
    field_mode: metric
    attribute: enrollment
    unit: count
    population: public
    minimum: 0
  rating:
    dataset: accountability
    field: overall_rating
    attribute: rating
    unit: text
    population: public
  overall_rating: rating
  tapr.*:
    dataset: '{scope}_tapr_student_staff_profile'
    field: '{metric}'
    field_mode: metric
    population: public
    minimum: 0
    unit_suffixes:
      _percent: percent
    unit_bounds:
      percent:
        minimum: 0
        maximum: 100
  baseline.*:
    dataset: campus_tapr_historical_enrollment
    field: '{metric}'
    field_mode: metric
    population: public
    scopes:
    - campus
    minimum: 0
    unit_suffixes:
      _percent: percent
    unit_bounds:
      percent:
        minimum: 0
        maximum: 100
  financials.*:
    dataset: campus_peims_financials
    field: '{metric}'
    population: public
    scopes:
    - campus
    unit_suffixes:
      _per_student: currency
  accountability.*:
    dataset: accountability
    field: '{metric}'
    field_mode: metric
    population: public
    minimum: 0
  transfer.count:
    dataset: campus_transfer_reports
    field: TRANSFERS_IN_OR_OUT
    population: public
    scopes:
    - campus
    unit: count
    minimum: 0
