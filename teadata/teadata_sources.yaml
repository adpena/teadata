        publisher: Texas Education Agency
        version: 2026-04
        period: {kind: unknown}
        source_url: https://tea4avcastro.tea.state.tx.us/oess/edrs/teacher-retention-dashboard/downloads/Teacher_Retention_Workbook.xlsx
        value_policy: edrs_retention_2026
        metrics: &educator_retention_metrics
          first_year_teacher_count: {field: first_year_teacher_count, unit: count}
          retained_year_1_count: {field: retained_year_1_count, unit: count}
          retained_year_1_ratio: {field: retained_year_1_ratio, unit: ratio}
          retained_year_2_count: {field: retained_year_2_count, unit: count}
          retained_year_2_ratio: {field: retained_year_2_ratio, unit: ratio}
          retained_year_3_count: {field: retained_year_3_count, unit: count}
          retained_year_3_ratio: {field: retained_year_3_ratio, unit: ratio}
          retained_year_4_count: {field: retained_year_4_count, unit: count}
          retained_year_4_ratio: {field: retained_year_4_ratio, unit: ratio}
          retained_year_5_count: {field: retained_year_5_count, unit: count}
          retained_year_5_ratio: {field: retained_year_5_ratio, unit: ratio}
        notes: >-
          School year selects the first-teaching cohort. Year n is continuous employment through the nth
          school year after that cohort. The published denominator covers teachers of record who received
          their initial standard certificate in the preceding academic year and taught in Texas public
          schools at 0.5 or greater cumulative FTE. An interruption ends continuous retention even when
          a teacher returns. A blank is an unreported follow-up horizon. The three views share statewide
          totals and have overlapping populations. They are separate from pathway at entry and TAPR turnover.
          The 2017–18 preparation-route cohort is held after a publisher example failed to reconcile.
        references: &educator_retention_references
        - reference_id: retention_workbook
          role: data_dictionary
          title: TEA Teacher Retention Workbook introduction and data dictionary (created February 24, 2026)
