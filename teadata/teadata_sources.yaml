        notes: >-
          Annual-graduate college-readiness components from the complete offered
          source-only download. The AP/IB criterion and dual-credit criterion
          rates for all students and for economically disadvantaged students
          are percentages for 2023–24 annual graduates, corroborated by the
          same-edition Austin ISD TPRS report. The public report does not
          independently confirm the numerator or denominator. The family
          period, other field periods and units, and temporal comparability
          remain unknown. The same Austin report masks the 2023–24 American
          Indian rates with asterisks, corresponding to CSV -1 values in
          DI0GY24R and DI0GUA24R. No value policy or estimate is applied. Raw strings,
          ordered dictionary occurrences, shared denominator contexts and
          original acquisition receipts are preserved. These criteria are
          separate from ERC course participation and Outcomes Bonus funding.
          The source profile activates no default reader, entity enrichment,
          or released data and infers no State or regional aggregate.
