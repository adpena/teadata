          with an asterisk, corresponding to the CSV value -1 in DI0GP24R.
          All raw fields, including blanks and -1, stay exact strings. Ordered
          dictionary occurrences retain shared denominator contexts. Original
          acquisition receipts preserve the publisher's controls and dates.
          This is separate from Outcomes Bonus funding, ERC course participation,
          and current student Membership. Equivalence to accountability rates
          that incorporate accepted PEIMS Working Submission adjustments remains
          unverified. The source profile activates no default reader, entity
          enrichment, or released data.
