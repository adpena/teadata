        notes: 'Source-only independent STAF observation within publisher edition
          2024. Mixed measurement periods: table period and undeclared field periods
          are explicitly unknown; edition and code suffixes do not establish a reference
          period. For STUD only, reviewed dictionary descriptions identify 2022-23
          attrition and 2023 mobility; annual 2023-24 TAPR Glossary page 32 defines
          mobility in 2022-23 and attrition from fall 2022 to fall 2023, supporting
          the two qualified 2022-23 percent bindings. No other field period/unit is
          assigned except the bounded basic-total review below. CSV labels/code/order
          and complete original dictionary occurrences are retained, including identical
          duplicate rows. Dictionary-only codes are not fabricated CSV fields; conflicting
          definitions fail. Campus STAF CPSCTOFC has no dictionary definition; dictionary-only
          CPSCTOST/DPSCTOST are not aliases. Raw dots, blanks, zeros and positive
          numeric observations remain distinct; causes and status are not guessed.
          Original HTTP receipts retain their original composite dataset names and
          are linked through csv_headers as source derivation history, not relabeled.
          Do not coalesce with retained PROF, other families or revisions, and do
          not fill absent fields from PROF. Historical keys/names/parents are source
          attributes independent of current GIS. No default released reader, semantic
          binding or entity hydration is activated.Bounded current-source review:
          annual glossary page 28 labels Student Information (2023-24), defines enrollment
          as the last-Friday-in-October snapshot and defines Total Students. The exact
          current CPNTALLC/DPNTALLC dictionary descriptions identify total enrollment
          count. Its 2023-24 school-year binding records that source context, not
          an annual cumulative measurement; exact as_of date is unrecorded and not
          invented. Annual glossary page 34 labels Staff Information (2023-24); exact
          current CPSATOFC/DPSATOFC descriptions identify All Staff Total Full Time
          Equiv Count. Only those staff fields receive 2023-24; FTE is not headcount,
          the precise observation date is unspecified and unit stays unknown under
          the existing unit vocabulary. No blanket period assignment is made to other
          fields. '
