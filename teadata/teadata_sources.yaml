          years with the district. Average teacher salary includes regular duties only, excludes supplemental
          pay and divides regular-duty teacher salary by teacher FTE. The reported students-per-teacher ratio
          divides total students by teacher FTE; it is retained as reported rather than recomputed from another
          enrollment source. The retained field name Teacher Turnover Ratio denotes a percent; fall 2023-24
          teachers not employed as teachers in the district in fall 2024-25, divided by fall 2023-24 teacher
          FTE. It includes roles 087 and 047 and teachers remaining employed in another role. The 2024-25 reference
          period identifies the report's destination school year; the prior-fall denominator and two-fall comparison
          are preserved explicitly here. This metric is district-only. No strict under-five-years measure is
          inferred from the zero-years and inclusive 1-5-years bands.
